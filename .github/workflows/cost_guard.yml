name: cost guard

# ExerPy ships no cost correlations and no cost index tables, on any branch.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan the tracked files
        run: python .github/scripts/check_cost_content.py
