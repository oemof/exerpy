name: packaging

on:
  # Make sure packaging process is not broken
  push:
    branches: [main, dev]
  pull_request:
  # Make a package for release
  release:
    types: [published]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip twine build flit
    - name: Create packages
      run: python -m build .
    - name: Run twine check
      run: twine check dist/*
    - name: Verify excluded paths not in wheel
      run: |
        BLOCKED="cost_estimation cost_correlations"
        for whl in dist/*.whl; do
          echo "Inspecting $whl ..."
          for pattern in $BLOCKED; do
            if unzip -l "$whl" | grep -q "$pattern"; then
              echo "FAIL: '$pattern' found in $whl"
              unzip -l "$whl" | grep "$pattern"
              exit 1
            fi
          done
          echo "OK – no blocked paths found"
        done
    - uses: actions/upload-artifact@v4
      with:
        name: tox-gh-actions-dist
        path: dist
