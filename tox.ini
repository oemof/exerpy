[tox]
envlist =
    check,
    docs,
    py311,
    py312,
    py313

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313

[testenv]
basepython =
    {check,docs}: {env:TOXPYTHON:python3.12}
setenv =
    PYTHONPATH={toxinidir}/tests
    PYTHONUNBUFFERED=yes
    MPLBACKEND=Agg
passenv =
    *
extras =
    dev
commands =
    {posargs:pytest -vv --ignore=src}

[testenv:check]
deps =
    check-manifest
    ruff
    black
skip_install = true
commands =
    check-manifest {toxinidir}
    ruff check src tests
    black --check src tests

[testenv:docs]
usedevelop = true
commands =
    sphinx-build {posargs:-E} -b html docs docs/_build
    sphinx-build -b linkcheck docs docs/_build

[testenv:py311]
basepython = {env:TOXPYTHON:python3.11}
setenv =
    {[testenv]setenv}
usedevelop = true
commands =
    {posargs:pytest --cov --cov-report=term-missing -vv}
deps =
    pytest-cov

[testenv:py312]
basepython = {env:TOXPYTHON:python3.12}
setenv =
    {[testenv]setenv}
usedevelop = true
commands =
    {posargs:pytest --cov --cov-report=term-missing -vv}
deps =
    pytest-cov

[testenv:py313]
basepython = {env:TOXPYTHON:python3.13}
setenv =
    {[testenv]setenv}
usedevelop = true
commands =
    {posargs:pytest --cov --cov-report=term-missing -vv}
deps =
    pytest-cov

[testenv:fmt]
description = Auto-format with black
deps = black
skip_install = true
commands = black src tests

[testenv:lint]
description = Lint & auto-fix with ruff (incl. import sort)
deps = ruff
skip_install = true
commands = ruff check --fix src tests